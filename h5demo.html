<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>H5回弹效果</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #f2f2f7;
        }

        header {
            height: 44px;
            padding-top: env(safe-area-inset-top);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 17px;
            z-index: 100;
            flex-shrink: 0;
        }

        .scroll-view {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            
            scrollbar-width: none; 
            overscroll-behavior-y: none; 
        }
        
        .scroll-view::-webkit-scrollbar {
            display: none;
        }

        .scroll-content {
            background-color: #fff;
            min-height: 100%;
            transform: translate3d(0,0,0);
            will-change: transform;
        }

        .list-item {
            padding: 16px;
            border-bottom: 0.5px solid #c6c6c8;
            background: #fff;
            font-size: 17px;
        }
        .list-item:active {
            background-color: #d1d1d6;
        }

        .loading {
            padding: 20px 0;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .end-tip {
            padding: 40px 0;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>H5回弹效果</header>
    
    <div class="scroll-view" id="scrollView">
        <div class="scroll-content" id="scrollContent">
            </div>
    </div>
</div>

<script>
    const content = document.getElementById('scrollContent');
    const scrollView = document.getElementById('scrollView');
    const scrollContent = document.getElementById('scrollContent');
    
    let currentCount = 0;
    const INITIAL_COUNT = 20;
    const LOAD_MORE_COUNT = 20;
    const MAX_COUNT = 60;
    let isLoading = false;
    
    function generateItems(startIndex, count) {
        let html = '';
        for(let i = startIndex; i < startIndex + count; i++) {
            html += `<div class="list-item">列表项 ${i} <span style="float:right;color:#999">></span></div>`;
        }
        return html;
    }
    
    function renderContent() {
        let html = generateItems(1, currentCount);
        if (currentCount >= MAX_COUNT) {
            html += `<div class="end-tip">已显示全部内容</div>`;
        } else {
            html += `<div class="loading" id="loadingTip">加载中</div>`;
        }
        content.innerHTML = html;
    }
    
    function loadMoreData() {
        if (isLoading || currentCount >= MAX_COUNT) return;
        
        isLoading = true;
        const loadingTip = document.getElementById('loadingTip');
        if (loadingTip) {
            loadingTip.textContent = '加载中';
            loadingTip.className = 'loading';
        }
        
        setTimeout(() => {
            const newCount = Math.min(currentCount + LOAD_MORE_COUNT, MAX_COUNT);
            currentCount = newCount;
            renderContent();
            isLoading = false;
        }, 800);
    }
    
    function checkScrollBottom() {
        const scrollTop = scrollView.scrollTop;
        const scrollHeight = scrollView.scrollHeight;
        const offsetHeight = scrollView.offsetHeight;
        const threshold = 50;
        
        if (scrollTop + offsetHeight >= scrollHeight - threshold) {
            loadMoreData();
        }
    }
    
    currentCount = INITIAL_COUNT;
    renderContent();
    
    scrollView.addEventListener('scroll', checkScrollBottom);
    
    let startY = 0;
    let lastY = 0;
    let currentTranslate = 0;
    let isDragging = false;
    let isTouching = false;

    const VIEWPORT_HEIGHT = window.innerHeight;
    
    scrollView.addEventListener('touchstart', (e) => {
        isTouching = true;
        startY = e.touches[0].clientY;
        lastY = startY;
        
        scrollContent.style.transition = 'none';
        
    }, { passive: false });

    scrollView.addEventListener('touchmove', (e) => {
        if (!isTouching) return;

        const currentY = e.touches[0].clientY;
        const deltaY = currentY - lastY; 
        lastY = currentY;

        const scrollTop = scrollView.scrollTop;
        const scrollHeight = scrollView.scrollHeight;
        const offsetHeight = scrollView.offsetHeight;

        const isAtTop = scrollTop <= 0;
        const isAtBottom = (scrollTop + offsetHeight) >= (scrollHeight - 1);

        if (isDragging) {
            e.preventDefault();
            
            const friction = (1 - Math.abs(currentTranslate) / VIEWPORT_HEIGHT);
            
            currentTranslate += deltaY * friction * 0.5;

            scrollContent.style.transform = `translate3d(0, ${currentTranslate}px, 0)`;
            return;
        }

        if ((isAtTop && deltaY > 0) || (isAtBottom && deltaY < 0)) {
            isDragging = true;
            e.preventDefault();
            
        }

    }, { passive: false });

    scrollView.addEventListener('touchend', (e) => {
        isTouching = false;
        isDragging = false;

        if (currentTranslate !== 0) {
            scrollContent.style.transition = 'transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1)';
            currentTranslate = 0;
            scrollContent.style.transform = `translate3d(0, 0, 0)`;
        }
    });
</script>

</body>
</html>
